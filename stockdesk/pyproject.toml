[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdesk-local"
version = "0.1.0"
description = "Local-first inventory operations with an auditable stock ledger"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi==0.128.2",
  "starlette==0.50.0",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "Jinja2==3.1.6",
  "itsdangerous==2.2.0",
  "python-multipart==0.0.29",
]

[project.scripts]
stockdesk = "stockdesk.cli:main"

[tool.setuptools.packages.find]
include = ["stockdesk*"]

[tool.setuptools.package-data]
stockdesk = ["templates/*.html", "static/*.css", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["stockdesk"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
