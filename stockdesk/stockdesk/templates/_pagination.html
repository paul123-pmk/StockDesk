<div class="pagination"><span>{{ report.total }} records · page {{ report.page }} of {{ report.pages }}</span><div>{% if report.page > 1 %}<a class="button secondary compact" href="{{ request.url.include_query_params(page=report.page-1) }}">Previous</a>{% endif %}{% if report.page < report.pages %}<a class="button secondary compact" href="{{ request.url.include_query_params(page=report.page+1) }}">Next</a>{% endif %}</div></div>
